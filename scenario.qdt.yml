metadata:
  id: qdt-test-light
  title: Test déploiement profil Light
  description: Scénario de test local pour le profil Light

settings: {}

steps:
  - name: Find installed QGIS
    uses: qgis-installation-finder
    with: {}

  - name: Download profiles from local Git repository
    uses: qprofiles-downloader
    with:
      branch: add-qgis-light-profiles
      protocol: git_local
      source: file:///home/florent/oslandia/projet/qdt-examples-qgis-profiles

  - name: Synchronize installed profiles
    uses: qprofiles-synchronizer
    with:
      sync_mode: overwrite

  - name: Download plugins to QDT working folder
    uses: qplugins-downloader
    with:
      force: false
      threads: 5

  - name: Synchronize plugins
    uses: qplugins-synchronizer
    with:
      action: create_or_restore
      profile_ref: downloaded

  - name: Create shortcuts for profiles
    uses: shortcuts-manager
    with:
      action: create_or_restore
      include:
        - profile: Light
          label: "QGIS - Light"
          desktop: true
          start_menu: true
          icon: "icon.ico"

  - name: Set splash screen
    uses: splash-screen-manager
    with:
      action: create_or_restore
      strict: false
