metadata:
  id: qdt-examples-qgis-profiles
  title: QDT examples QGIS profiles deployment
  description: Deploys all the example profiles of the qdt-examples-qgis-profiles repository

settings: {}

steps:
  - name: Find installed QGIS
    uses: qgis-installation-finder
    with:
      search_paths:
        - "%PROGRAMFILES%\\QGIS"
        - "%PROGRAMFILES%"
        - "C:\\OSGeo4W"
        - "/usr/bin/qgis"
      version_priority:
        - "4.2"
        - "3.44"
        - "4.4"
        - "3.40"
        - "4.2"
        - "3.34"
        - "4.0"
        - "3.28"

  - name: Download profiles from remote Git repository
    uses: qprofiles-downloader
    with:
      branch: add-laax-qgis-profiles
      protocol: git_remote
      source: https://github.com/qgis-deployment/qdt-examples-qgis-profiles

  - name: Synchronize installed profiles
    uses: qprofiles-synchronizer
    with:
      sync_mode: overwrite

  - name: Download plugins to QDT working folder
    uses: qplugins-downloader
    with:
      force: false
      threads: 5

  - name: Synchronize plugins
    uses: qplugins-synchronizer
    with:
      action: create_or_restore
      profile_ref: downloaded

  - name: Create shortcuts for profiles
    uses: shortcuts-manager
    with:
      action: create_or_restore
      include:
        - profile: Light
          label: "QGIS - Light"
          desktop: true
          start_menu: true
          icon: "icon.ico"
        - profile: "QGIS User Conference 2026"
          label: "QGIS User Conference 2026"
          desktop: true
          start_menu: true
          icon: "icon.ico"

  - name: Set splash screen
    uses: splash-screen-manager
    with:
      action: create_or_restore
      strict: false
